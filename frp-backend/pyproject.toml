[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ember-rpg"
version = "0.1.0"
description = "Ember RPG - AI-powered fantasy RPG game engine"
requires-python = ">=3.11"
dependencies = ["opensimplex>=0.4.5", "websockets>=13.1,<16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "playtest: chaotic FRP player integration/scenario tests",
    "slow: long-running chaos tests (500+ turns)",
    "asyncio: async test requiring event loop",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
