[scenario]
name = "title_continue_browser"
description = "Open the canonical continue browser from the title screen using semantic scene actions."
adapter_id = "fantasy_ember"
player_name = "Chaos"
create_new = false
requires_backend = true
tags = ["title", "continue", "save-browser", "semantic"]

[[steps]]
id = "capture_title"
action = "capture_viewport"
expected = "title screen is visible"

[[steps]]
id = "open_continue_browser"
action = "activate_node"
node_path = "VBoxContainer/ContinueButton"
wait_ms = 750
capture_viewport = true
expected = "continue browser opens"

[[steps]]
id = "set_player_lookup"
action = "set_text_node"
node_path = "LoadBrowser/VBox/PlayerRow/PlayerInput"
text = "Chaos"
wait_ms = 100
expected = "player lookup contains Chaos"

[[steps]]
id = "refresh_player_saves"
action = "wait"
duration_ms = 400
expected = "continue browser auto-refresh settles for Chaos"

[[steps]]
id = "wait_for_load_button"
action = "wait_for_node"
node_path = "LoadButton"
duration_ms = 6000
capture_viewport = true
expected = "continue browser shows campaign saves for Chaos"



