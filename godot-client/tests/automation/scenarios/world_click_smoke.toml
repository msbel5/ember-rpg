[scenario]
name = "world_click_smoke"
description = "Click a logical position inside the world viewport and verify an interaction fires."
adapter_id = "fantasy_ember"
player_name = "Chaos"
create_new = false
requires_backend = true
tags = ["gameplay", "world-click", "semantic"]

[[steps]]
id = "open_continue"
action = "activate_node"
node_path = "TitleMenu/FrontDoor/RootSplit/MenuColumn/MenuPanel/MenuMargin/MenuVBox/ContinueButton"
wait_ms = 700
capture_viewport = true
expected = "continue browser opens"

[[steps]]
id = "set_player_lookup"
action = "set_text_node"
node_path = "LoadBrowser/VBox/PlayerRow/PlayerInput"
text = "Chaos"
wait_ms = 100
expected = "player lookup contains Chaos"

[[steps]]
id = "refresh_player_saves"
action = "wait"
duration_ms = 400
expected = "continue browser auto-refresh settles for Chaos"

[[steps]]
id = "wait_for_load_button"
action = "wait_for_node_visible"
node_path = "LoadBrowser/VBox/SaveScroll/SaveList/SaveRow0/LoadButton0"
duration_ms = 6000
capture_viewport = true
expected = "continue browser shows campaign saves for Chaos"

[[steps]]
id = "load_first_save"
action = "activate_node"
node_path = "LoadBrowser/VBox/SaveScroll/SaveList/SaveRow0/LoadButton0"
wait_ms = 200
expected = "campaign load starts"

[[steps]]
id = "wait_for_game_session"
action = "wait_for_scene"
scene_name = "GameSession"
duration_ms = 10000
capture_viewport = true
expected = "gameplay scene loads"
expect_note_contains = "GameSession"

[[steps]]
id = "wait_for_world_view"
action = "wait_for_node"
node_path = "MainMargin/MainVBox/ContentSplit/WorldPane/WorldViewportContainer"
duration_ms = 3000
expected = "world viewport is available"

[[steps]]
id = "click_world_target"
action = "click_node"
node_path = "MainMargin/MainVBox/ContentSplit/WorldPane/WorldViewportContainer"
normalized_x = 0.54
normalized_y = 0.42
wait_ms = 1000
capture_viewport = true
expected = "world click triggers movement or interaction"
expect_note_contains = "GameSession"



