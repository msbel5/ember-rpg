[scenario]
name = "new_game_keyboard_flow"
description = "Keyboard-first title flow through the creation wizard using semantic scene actions."
adapter_id = "fantasy_ember"
player_name = "VisualSmoke"
create_new = true
requires_backend = true
tags = ["title", "creation", "keyboard", "semantic"]

[[steps]]
id = "capture_title"
action = "capture_viewport"
expected = "title screen is visible"

[[steps]]
id = "focus_new_game"
action = "focus_node"
node_path = "VBoxContainer/NewGameButton"
wait_ms = 150
expected = "new game button receives keyboard focus"

[[steps]]
id = "open_new_game"
action = "activate_node"
node_path = "VBoxContainer/NewGameButton"
wait_ms = 500
capture_viewport = true
expected = "new game wizard opens"

[[steps]]
id = "set_player_name"
action = "set_text_node"
node_path = "CharacterCreation/VBox/CreationBody/FormPane/FormScroll/FormContent/IdentitySection/NameInput"
text = "VisualSmoke"
wait_ms = 150
expected = "name field receives input"

[[steps]]
id = "capture_identity_ready"
action = "capture_viewport"
expected = "identity step is ready to advance"

[[steps]]
id = "advance_identity"
action = "activate_node"
node_path = "CharacterCreation/VBox/ButtonRow/NextButton"
wait_ms = 800
capture_viewport = true
expected = "wizard advances past identity"
expect_artifact_differs_from = "capture_identity_ready:viewport_capture"
