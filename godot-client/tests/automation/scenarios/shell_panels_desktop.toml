[scenario]
name = "shell_panels_desktop"
description = "Desktop proof for the active gameplay shell panels driven by the instrument rail."
adapter_id = "fantasy_ember"
player_name = "Chaos"
create_new = false
requires_backend = true
tags = ["desktop", "gameplay", "shell", "proof"]

[[steps]]
id = "focus_window"
action = "activate_window"
capture_os = true
capture_viewport = true
expected = "title screen is visible in a desktop window"

[[steps]]
id = "wait_for_continue_button"
action = "wait_for_node_visible"
node_path = "TitleMenu/FrontDoor/RootSplit/MenuColumn/MenuPanel/MenuMargin/MenuVBox/ContinueButton"
duration_ms = 4000
expected = "continue button is ready"

[[steps]]
id = "open_continue"
action = "activate_node"
node_path = "TitleMenu/FrontDoor/RootSplit/MenuColumn/MenuPanel/MenuMargin/MenuVBox/ContinueButton"
wait_ms = 1200
capture_os = true
capture_viewport = true
expected = "continue browser opens with campaign saves"

[[steps]]
id = "wait_for_load_button"
action = "wait_for_node_visible"
node_path = "LoadBrowser/VBox/SaveScroll/SaveList/SaveRow0/LoadButton0"
duration_ms = 6000
expected = "continue browser shows a canonical campaign save"

[[steps]]
id = "load_first_save"
action = "activate_node"
node_path = "LoadBrowser/VBox/SaveScroll/SaveList/SaveRow0/LoadButton0"
wait_ms = 1200
capture_os = true
capture_viewport = true
expected = "gameplay shell opens from the selected save"

[[steps]]
id = "open_hero_panel"
action = "activate_node"
node_path = "MainMargin/MainVBox/InstrumentRail/RailMargin/RailVBox/ShellGrid/HeroButton"
wait_ms = 600
capture_os = true
capture_viewport = true
expected = "hero panel opens through the active shell rail"

[[steps]]
id = "open_town_panel"
action = "activate_node"
node_path = "MainMargin/MainVBox/InstrumentRail/RailMargin/RailVBox/ShellGrid/TownButton"
wait_ms = 600
capture_os = true
capture_viewport = true
expected = "town panel opens through the active shell rail"

[[steps]]
id = "open_quests_panel"
action = "activate_node"
node_path = "MainMargin/MainVBox/InstrumentRail/RailMargin/RailVBox/ShellGrid/QuestsButton"
wait_ms = 600
capture_os = true
capture_viewport = true
expected = "quests panel opens through the active shell rail"

[[steps]]
id = "open_items_panel"
action = "activate_node"
node_path = "MainMargin/MainVBox/InstrumentRail/RailMargin/RailVBox/ShellGrid/ItemsButton"
wait_ms = 600
capture_os = true
capture_viewport = true
expected = "items panel opens through the active shell rail"

[[steps]]
id = "open_map_panel"
action = "activate_node"
node_path = "MainMargin/MainVBox/InstrumentRail/RailMargin/RailVBox/ShellGrid/MapButton"
wait_ms = 600
capture_os = true
capture_viewport = true
expected = "map panel opens through the active shell rail"

[[steps]]
id = "open_pause_panel"
action = "activate_node"
node_path = "MainMargin/MainVBox/InstrumentRail/RailMargin/RailVBox/ShellGrid/MenuButton"
wait_ms = 600
capture_os = true
capture_viewport = true
expected = "pause counsel opens through the active shell rail"
