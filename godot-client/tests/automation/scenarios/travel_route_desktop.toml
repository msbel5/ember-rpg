[scenario]
name = "travel_route_desktop"
description = "Desktop proof for route-backed travel start and active travel_state controls from the Map tab."
adapter_id = "fantasy_ember"
player_name = "TravelSmoke"
create_new = false
requires_backend = true
tags = ["desktop", "travel", "semantic", "proof"]

[[steps]]
id = "focus_window"
action = "activate_window"
capture_os = true
capture_viewport = true
expected = "title screen is visible in a desktop window"

[[steps]]
id = "wait_for_continue_button"
action = "wait_for_node_visible"
node_path = "TitleMenu/FrontDoor/RootSplit/MenuColumn/MenuPanel/MenuMargin/MenuVBox/ContinueButton"
duration_ms = 4000
expected = "continue button is ready"

[[steps]]
id = "open_continue"
action = "activate_node"
node_path = "TitleMenu/FrontDoor/RootSplit/MenuColumn/MenuPanel/MenuMargin/MenuVBox/ContinueButton"
wait_ms = 1200
capture_os = true
capture_viewport = true
expected = "continue browser opens with campaign saves"

[[steps]]
id = "set_player_lookup"
action = "set_text_node"
node_path = "LoadBrowser/VBox/PlayerRow/PlayerInput"
text = "TravelSmoke"
wait_ms = 100
expected = "continue browser filters to the travel proof player"

[[steps]]
id = "wait_for_load_button"
action = "wait_for_node_visible"
node_path = "LoadBrowser/VBox/SaveScroll/SaveList/SaveRow0/LoadButton0"
duration_ms = 6000
expected = "continue browser shows a canonical campaign save"

[[steps]]
id = "load_first_save"
action = "activate_node"
node_path = "LoadBrowser/VBox/SaveScroll/SaveList/SaveRow0/LoadButton0"
wait_ms = 1200
capture_os = true
capture_viewport = true
expected = "gameplay shell opens from the selected save"

[[steps]]
id = "wait_for_game_session"
action = "wait_for_scene"
scene_name = "GameSession"
duration_ms = 10000
expected = "gameplay scene loads"
expect_note_contains = "GameSession"

[[steps]]
id = "open_map_tab"
action = "activate_node"
node_path = "MainMargin/MainVBox/InstrumentRail/RailMargin/RailVBox/ShellGrid/MapButton"
wait_ms = 600
capture_os = true
capture_viewport = true
expected = "map tab is visible"

[[steps]]
id = "wait_for_route_button"
action = "wait_for_node_visible"
node_path = "MainMargin/MainVBox/ContentSplit/ModalHost/ModalStack/MinimapPanel/MinimapMargin/MinimapVBox/RoutesList/RouteButton0"
duration_ms = 4000
expected = "a semantic travel route is available"

[[steps]]
id = "wait_for_route_button_text"
action = "wait_for_node_text"
node_path = "MainMargin/MainVBox/ContentSplit/ModalHost/ModalStack/MinimapPanel/MinimapMargin/MinimapVBox/RoutesList/RouteButton0"
text = "Grove Elf Grove"
duration_ms = 3000
expected = "the first route points to the expected destination"

[[steps]]
id = "use_first_route"
action = "activate_node"
node_path = "MainMargin/MainVBox/ContentSplit/ModalHost/ModalStack/MinimapPanel/MinimapMargin/MinimapVBox/RoutesList/RouteButton0"
wait_ms = 1800
capture_os = true
capture_viewport = true
expected = "semantic travel command is issued from the map tab"

[[steps]]
id = "wait_for_active_travel_summary"
action = "wait_for_node_text"
node_path = "MainMargin/MainVBox/ContentSplit/ModalHost/ModalStack/MinimapPanel/MinimapMargin/MinimapVBox/SummaryLabel"
text = "Traveling to Grove Elf Grove"
duration_ms = 10000
expected = "map tab reflects active travel_state instead of route-start controls"

[[steps]]
id = "wait_for_continue_travel"
action = "wait_for_node_visible"
node_path = "MainMargin/MainVBox/ContentSplit/ModalHost/ModalStack/MinimapPanel/MinimapMargin/MinimapVBox/RoutesList/ContinueTravelButton"
duration_ms = 10000
expected = "active travel exposes continue travel from travel_state truth"

[[steps]]
id = "continue_travel_once"
action = "activate_node"
node_path = "MainMargin/MainVBox/ContentSplit/ModalHost/ModalStack/MinimapPanel/MinimapMargin/MinimapVBox/RoutesList/ContinueTravelButton"
wait_ms = 1800
capture_os = true
capture_viewport = true
expected = "active travel advances through a truthful continue travel control"



