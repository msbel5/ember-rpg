[scenario]
name = "resume_and_command"
description = "Resume a campaign from title and issue a narrative command using semantic scene actions."
adapter_id = "fantasy_ember"
player_name = "Chaos"
create_new = false
requires_backend = true
tags = ["title", "resume", "command", "semantic"]

[[steps]]
id = "open_continue"
action = "activate_node"
node_path = "TitleMenu/Shell/RootVBox/MenuPanel/MenuMargin/MenuVBox/ContinueButton"
wait_ms = 700
capture_viewport = true
expected = "continue browser opens"

[[steps]]
id = "set_player_lookup"
action = "set_text_node"
node_path = "LoadBrowser/VBox/PlayerRow/PlayerInput"
text = "Chaos"
wait_ms = 100
expected = "player lookup contains Chaos"

[[steps]]
id = "refresh_player_saves"
action = "wait"
duration_ms = 400
expected = "continue browser auto-refresh settles for Chaos"

[[steps]]
id = "wait_for_load_button"
action = "wait_for_node_visible"
node_path = "LoadBrowser/VBox/SaveScroll/SaveList/SaveRow0/LoadButton0"
duration_ms = 6000
capture_viewport = true
expected = "continue browser shows campaign saves for Chaos"

[[steps]]
id = "load_first_save"
action = "activate_node"
node_path = "LoadBrowser/VBox/SaveScroll/SaveList/SaveRow0/LoadButton0"
wait_ms = 200
expected = "campaign load starts"

[[steps]]
id = "wait_for_game_session"
action = "wait_for_scene"
scene_name = "GameSession"
duration_ms = 10000
capture_viewport = true
expected = "gameplay scene loads"
expect_note_contains = "GameSession"

[[steps]]
id = "wait_for_command_bar"
action = "wait_for_node_visible"
node_path = "MainMargin/MainVBox/CommandBar/CommandVBox/InputRow/TextInput"
duration_ms = 3000
expected = "command bar is available"

[[steps]]
id = "focus_command_bar"
action = "focus_node"
node_path = "MainMargin/MainVBox/CommandBar/CommandVBox/InputRow/TextInput"
wait_ms = 100
expected = "command input receives focus"

[[steps]]
id = "set_command"
action = "set_text_node"
node_path = "MainMargin/MainVBox/CommandBar/CommandVBox/InputRow/TextInput"
text = "look around"
wait_ms = 100
expected = "command text appears in input"

[[steps]]
id = "submit_command"
action = "activate_node"
node_path = "MainMargin/MainVBox/CommandBar/CommandVBox/InputRow/SendButton"
wait_ms = 1200
capture_viewport = true
expected = "narrative updates after command"
expect_note_contains = "GameSession"
expect_artifact_differs_from = "wait_for_game_session:viewport_capture"
