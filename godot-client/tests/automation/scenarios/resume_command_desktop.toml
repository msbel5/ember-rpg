[scenario]
name = "resume_command_desktop"
description = "Desktop proof for loading a canonical campaign save and issuing one gameplay command with semantic node actions."
adapter_id = "fantasy_ember"
player_name = "Chaos"
create_new = false
requires_backend = true
tags = ["resume", "command", "desktop", "proof", "semantic"]

[[steps]]
id = "focus_window"
action = "activate_window"
capture_os = true
capture_viewport = true
expected = "title screen is visible in a desktop window"

[[steps]]
id = "wait_for_backend_ready"
action = "wait"
duration_ms = 6500
capture_os = true
capture_viewport = true
expected = "title screen finishes backend bootstrap and save discovery"

[[steps]]
id = "wait_for_continue_button"
action = "wait_for_node_visible"
node_path = "TitleMenu/Shell/RootVBox/MenuPanel/MenuMargin/MenuVBox/ContinueButton"
duration_ms = 4000
expected = "continue button is ready"

[[steps]]
id = "open_continue"
action = "activate_node"
node_path = "TitleMenu/Shell/RootVBox/MenuPanel/MenuMargin/MenuVBox/ContinueButton"
wait_ms = 1200
capture_os = true
capture_viewport = true
expected = "continue browser opens"
expect_artifact_differs_from = "wait_for_backend_ready:viewport_capture"

[[steps]]
id = "wait_for_load_button"
action = "wait_for_node_visible"
node_path = "LoadBrowser/VBox/SaveScroll/SaveList/SaveRow0/LoadButton0"
duration_ms = 6000
capture_os = true
capture_viewport = true
expected = "continue browser shows canonical campaign saves"

[[steps]]
id = "load_first_save"
action = "activate_node"
node_path = "LoadBrowser/VBox/SaveScroll/SaveList/SaveRow0/LoadButton0"
wait_ms = 1200
expected = "campaign load starts"

[[steps]]
id = "wait_for_game_session"
action = "wait_for_scene"
scene_name = "GameSession"
duration_ms = 12000
capture_os = true
capture_viewport = true
expected = "gameplay shell loads from the fresh canonical save"
expect_note_contains = "GameSession"

[[steps]]
id = "wait_for_command_bar"
action = "wait_for_node_visible"
node_path = "MainMargin/MainVBox/CommandBar/CommandVBox/InputRow/TextInput"
duration_ms = 4000
expected = "command bar is visible"

[[steps]]
id = "set_command"
action = "set_text_node"
node_path = "MainMargin/MainVBox/CommandBar/CommandVBox/InputRow/TextInput"
text = "look around"
wait_ms = 150
expected = "command text appears in the input"

[[steps]]
id = "submit_command"
action = "activate_node"
node_path = "MainMargin/MainVBox/CommandBar/CommandVBox/InputRow/SendButton"
wait_ms = 1800
capture_os = true
capture_viewport = true
expected = "narrative updates after the command"
expect_note_contains = "GameSession"
expect_artifact_differs_from = "wait_for_game_session:viewport_capture"
